<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TaskMaster Group 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../frontend/styles/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .brand-badge {
      width: 52px;
      height: 52px;
      background: #4F46E5;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-badge">✓</div>
    <h2 style="font-size: 1.5rem; font-weight: 700; color: #0F172A; margin-bottom: 6px;">Sign in to TaskMaster</h2>
    <p style="color: #64748B; font-size: 0.875rem; margin-bottom: 28px;">Winter Internship — Group 4 Project Workspace</p>

    <form action="dashboard.html" method="GET">
      <div class="form-group" style="text-align: left; margin-bottom: 18px;">
        <label class="form-label" style="display: block; font-size: 0.813rem; font-weight: 600; margin-bottom: 6px; color: #334155;">Email Address</label>
        <input type="email" class="form-input" style="width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 8px;" required value="naivedya@group4.com" placeholder="name@domain.com">
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: 18px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <label class="form-label" style="font-size: 0.813rem; font-weight: 600; color: #334155;">Password</label>
          <a href="#" style="font-size: 0.75rem; color: #4F46E5; text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" class="form-input" style="width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 8px;" required value="••••••••••••" placeholder="Enter password">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.813rem; color: #475569;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" checked style="accent-color: #4F46E5;"> Remember me for 30 days
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; background: #4F46E5; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.938rem; cursor: pointer;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #F1F5F9; font-size: 0.813rem; color: #64748B;">
      UI/UX Design Spec &bull; Naivedya Pramod Yadav &bull; PM: Vyas Angre
    </div>
  </div>
</body>
</html>
