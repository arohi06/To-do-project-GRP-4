<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task Modal Prototype — Group 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../frontend/styles/styles.css">
  <style>
    body {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .modal-box {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.813rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 0.875rem; font-family: inherit; box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="modal-box">
    <div style="padding: 20px 24px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h3 style="font-size: 1.15rem; font-weight: 700; color: #0F172A;">Create New Task</h3>
        <p style="font-size: 0.813rem; color: #64748B;">Enter task specifications to assign to team deliverables.</p>
      </div>
      <a href="index.html" style="text-decoration: none; font-size: 1.25rem; color: #94A3B8;">✕</a>
    </div>

    <form action="task-list.html" method="GET" style="padding: 24px;">
      <div class="form-group">
        <label class="form-label">Task Title *</label>
        <input type="text" class="form-input" required placeholder="e.g. Test end-to-end user workflows on localhost" value="Test end-to-end user workflows on localhost">
      </div>

      <div class="form-group">
        <label class="form-label">Description (Optional)</label>
        <textarea class="form-textarea" rows="3" placeholder="Provide additional details or test steps...">Verify Login, Add Task, Edit, Filter, and Delete operations.</textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-select">
            <option value="high">🔴 High Priority</option>
            <option value="medium" selected>🟡 Medium Priority</option>
            <option value="low">🟢 Low Priority</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select">
            <option value="pending" selected>Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Due Date</label>
        <input type="date" class="form-input" value="2026-11-21">
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; padding-top: 16px; border-top: 1px solid #F1F5F9;">
        <a href="index.html" style="padding: 10px 18px; border: 1px solid #CBD5E1; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600; font-size: 0.875rem;">Cancel</a>
        <button type="submit" style="padding: 10px 20px; background: #4F46E5; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.875rem; cursor: pointer;">Save Task</button>
      </div>
    </form>
  </div>
</body>
</html>
